<!-- The RoboVAST mark: a 2x2 grid of variation cells, one a robot face, one carrying a check.
     Transparent ground, so the tab strip's own colour shows through and the icon is the mark
     rather than a tile. Same geometry as the app's inline BrandMark and the website header, so
     the three read as one product.

     The mint is stated as presentation attributes and only *overridden* by the media query, so a
     renderer that ignores CSS in a favicon still gets the brand colour rather than nothing. The
     override exists because a transparent ground means the icon has to survive a light tab strip
     too, where mint on near-white is almost invisible; the light-mode green is the one from the
     site's own hero wash. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <style>
    @media (prefers-color-scheme: light) {
      .cell { fill: rgba(48, 137, 111, 0.12); stroke: #30896f }
      .line { stroke: #30896f }
      .dot { fill: #30896f }
    }
  </style>
  <g class="cell" fill="rgba(168, 255, 207, 0.12)" stroke="#a8ffcf" stroke-width="1.5">
    <rect x="3" y="4" width="16" height="15" rx="5"/>
    <rect x="23" y="4" width="14" height="15" rx="4"/>
    <rect x="3" y="23" width="16" height="14" rx="4"/>
    <rect x="23" y="23" width="14" height="14" rx="4"/>
  </g>
  <g class="line" fill="none" stroke="#a8ffcf" stroke-linecap="round" stroke-width="1.7">
    <path d="M8 4V1.5M14 4V1.5"/>
    <path d="m26.5 30 3 3 5-6" stroke-linejoin="round" stroke-width="2"/>
  </g>
  <g class="dot" fill="#a8ffcf">
    <circle cx="8.5" cy="11.5" r="1.3"/>
    <circle cx="13.5" cy="11.5" r="1.3"/>
  </g>
</svg>
