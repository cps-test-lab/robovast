<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` lets the page reach under a notch and a home indicator, where the
         shell pads itself by `env(safe-area-inset-*)` rather than leaving a letterbox. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RoboVAST</title>
    <!-- Served from public/, so it lands at the dist root that robovast-service mounts. The same
         mark and geometry the sidebar draws inline, on a transparent ground so the tab strip's
         own colour shows through. Byte-identical to the website's favicon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
