# The built-in empty_room's occupancy grid: its four perimeter walls (inner faces at +-5 m),
# generated from the world with
#   roqsim scenes scene-to-map --world <a world of only `sim: {world: empty_room}`> \
#     --out empty_room --scan-height 0.2 --resolution 0.05 --free-from 0 0 --pad 0.3
# AMCL localizes against these walls; the barrier and the walker stay unmapped.
image: empty_room.pgm
mode: trinary
resolution: 0.05
origin: [-5.4, -5.4, 0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.196
