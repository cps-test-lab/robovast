# A Crazyflie 2 flying a waypoint course in a 6 x 6 m room. Standalone: roqsim sim world/drone_envelope.yaml

sim:
  name: Drone flight envelope
  world: room.xml
  pacing: realtime
  integrator: rk4
  # MuJoCo defaults both to 0, a vacuum: nothing damps the drone and wind does nothing.
  density: 1.225        # kg/m^3, a campaign factor
  viscosity: 1.8e-5     # Pa*s
  seed: 0               # wind_field's turbulence draws from it
  view:
    track: drone
    follow_heading: false
    distance: 2.4
    azimuth: 140
    elevation: -32

components:
  # Every box needs its own prefix: the plugin names its material `box_surface`, and two boxes
  # sharing a prefix collide on it. Pad and markers are visual only.
  - box:
      prefix: "pad_"
      pose: {position: {x: 0.0, y: 0.0, z: 0.002}}
      size: [0.5, 0.5, 0.004]
      color: [0.16, 0.42, 0.72, 1.0]
      collide: false
    name: landing_pad
  - box: {prefix: "wp1_", pose: {position: {x: 1.2, y: 1.2, z: 0.002}}, size: [0.25, 0.25, 0.004], color: [0.85, 0.85, 0.30, 1.0], collide: false}
    name: marker_wp1
  - box: {prefix: "wp2_", pose: {position: {x: -1.2, y: 1.2, z: 0.002}}, size: [0.25, 0.25, 0.004], color: [0.85, 0.85, 0.30, 1.0], collide: false}
    name: marker_wp2
  - box: {prefix: "wp3_", pose: {position: {x: -1.2, y: -1.2, z: 0.002}}, size: [0.25, 0.25, 0.004], color: [0.85, 0.85, 0.30, 1.0], collide: false}
    name: marker_wp3

  # Primitive furniture rather than the modelled props: those need the private asset package.
  - box: {prefix: "pillar_e_", pose: {position: {x: 2.2, y: 0.0, z: 0.9}}, size: [0.35, 1.4, 1.8], color: [0.62, 0.64, 0.67, 1.0]}
    name: pillar_east
  - box: {prefix: "bench_w_", pose: {position: {x: -2.2, y: 0.6, z: 0.45}}, size: [0.7, 1.6, 0.9], color: [0.55, 0.42, 0.30, 1.0]}
    name: bench_west
  - box: {prefix: "crate_", pose: {position: {x: 0.9, y: -2.0, z: 0.35}}, size: [0.6, 0.4, 0.7], color: [0.72, 0.60, 0.44, 1.0]}
    name: crate

  - spawn_robot:
      model: crazyflie_2
      prefix: "cf2_"
      pose:
        position: {x: 0.0, y: 0.0}
      namespace: drone        # endpoints land on /drone/...
    name: drone
    components:
      # From the manifest; restated because the campaign varies its limits.
      - quadrotor_controller:
          target: [0.0, 0.0, 1.2]
          max_tilt: 0.5
          max_accel: 4.0
          max_vel: 1.5
      - payload:
          mass: 0.0

  # Owns opt.wind; `sim.wind` must not also be set.
  - wind_field:
      steady: [0.0, 0.0, 0.0]
      turbulence: {intensity: 0.0, length_scale: 4.0}

  # Last: the bridge publishes what the interface registry holds when it is configured.
  - ros2_bridge: {}
