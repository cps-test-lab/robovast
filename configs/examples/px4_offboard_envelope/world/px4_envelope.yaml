# An X500-class quadrotor flown by PX4 SITL over the Simulator MAVLink API (TCP 4560, served by
# `px4_sitl`; PX4 dials in). Standalone (`roqsim sim world/px4_envelope.yaml`) it sits on the pad:
# the stabiliser is PX4, not a plugin.

sim:
  name: PX4 offboard flight envelope
  world: flight_room.xml
  pacing: realtime
  integrator: rk4
  # MuJoCo defaults both to 0, a vacuum: nothing damps the drone, wind does nothing, and EKF2 is
  # fed sensors from a world with no atmosphere.
  density: 1.225        # kg/m^3, a campaign factor
  viscosity: 1.8e-5     # Pa*s
  seed: 0               # wind_field's turbulence draws from it
  view:
    track: drone
    follow_heading: false
    distance: 9.0
    azimuth: 140
    elevation: -28

components:
  # Every box needs its own prefix: the plugin names its material `box_surface`, and two boxes
  # sharing a prefix collide on it. Pad and markers are visual only.
  - box:
      prefix: "pad_"
      pose: {position: {x: 0.0, y: 0.0, z: 0.005}}
      size: [2.0, 2.0, 0.01]
      color: [0.16, 0.42, 0.72, 1.0]
      collide: false
    name: landing_pad

  # The scenario's NED corners, in ENU.
  - box: {prefix: "wp1_", pose: {position: {x: 5.0, y: 5.0, z: 0.005}}, size: [1.0, 1.0, 0.01], color: [0.85, 0.85, 0.30, 1.0], collide: false}
    name: marker_wp1
  - box: {prefix: "wp2_", pose: {position: {x: -5.0, y: 5.0, z: 0.005}}, size: [1.0, 1.0, 0.01], color: [0.85, 0.85, 0.30, 1.0], collide: false}
    name: marker_wp2
  - box: {prefix: "wp3_", pose: {position: {x: -5.0, y: -5.0, z: 0.005}}, size: [1.0, 1.0, 0.01], color: [0.85, 0.85, 0.30, 1.0], collide: false}
    name: marker_wp3

  # Primitive furniture rather than the modelled props: those need the private asset package.
  - box: {prefix: "pillar_e_", pose: {position: {x: 8.0, y: 0.0, z: 2.0}}, size: [0.8, 3.0, 4.0], color: [0.62, 0.64, 0.67, 1.0]}
    name: pillar_east
  - box: {prefix: "container_w_", pose: {position: {x: -8.0, y: 2.0, z: 1.2}}, size: [1.2, 3.0, 2.4], color: [0.55, 0.42, 0.30, 1.0]}
    name: container_west
  - box: {prefix: "crate_", pose: {position: {x: 3.0, y: -8.0, z: 0.6}}, size: [1.0, 0.8, 1.2], color: [0.72, 0.60, 0.44, 1.0]}
    name: crate

  # PX4's default SITL airframe, so PX4's shipped mixer geometry and gains apply unchanged. The
  # Crazyflie cannot take its place: its model takes collective thrust plus body moments, not the
  # four per-rotor commands of HIL_ACTUATOR_CONTROLS.
  - spawn_robot:
      model: x500
      prefix: "x500_"
      pose:
        position: {x: 0.0, y: 0.0}
      namespace: drone        # the /fmu topics come from the DDS agent and are not namespaced
    name: drone
    components:
      # Defaults come from the model: 8.2 N per rotor and moment constant 0.05 m. Both must agree
      # with files/10020_none_x500 (MPC_THR_HOVER 0.6 on 2.0 kg; CA_ROTOR*_KM).
      - multirotor_motors: {}
      - payload:
          mass: 0.0
      # Required: EKF2 needs a fix before PX4 will arm in offboard. PX4's own default SITL home.
      - gnss:
          datum: {lat: 47.397742, lon: 8.545594, alt: 488.0}
      - px4_sitl:
          port: 4560

  # Owns opt.wind; `sim.wind` must not also be set. Declared even for the calm cells: a sweep over
  # a component the world lacks is refused.
  - wind_field:
      steady: [0.0, 0.0, 0.0]
      turbulence: {intensity: 0.0, length_scale: 4.0}
