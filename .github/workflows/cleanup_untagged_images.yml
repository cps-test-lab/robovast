---
name: Cleanup Untagged GHCR Images
on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight
  workflow_dispatch: # Allows manual trigger
permissions: read-all
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # How long an untagged image is kept anyway. A campaign pins the image it ran by digest,
      # so a moved tag leaves that digest untagged while it is still the only thing a re-run can
      # start from. Not permanence -- see the reasoning at the deletion step.
      GRACE_DAYS: 90
    permissions:
      packages: write
    strategy:
      matrix:
        package:
          - ${{ github.event.repository.name }}
          - ${{ github.event.repository.name }}-sidecar
          # The buildx layer cache (image.yml). Each push overwrites the per-job tag, which
          # leaves the superseded cache blobs untagged and unreferenced -- so without this the
          # package grows without bound. The grace window applies here too and is generous for
          # a cache, but harmless: an entry older than it is one no build has wanted in 90 days.
          - ${{ github.event.repository.name }}-buildcache
    steps:
      - name: Delete untagged images not referenced by tagged manifests for ${{ matrix.package }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail

          # Obtain a registry token to read manifests
          REGISTRY_TOKEN=$(curl -sf \
            -u "token:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${ORG}/${PACKAGE}:pull&service=ghcr.io" \
            | jq -r '.token')

          # Collect all digests referenced by tagged index manifests
          declare -A REFERENCED
          PAGE=1
          while true; do
            VERSIONS=$(curl -sf -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/${ORG}/packages/container/${PACKAGE}/versions?per_page=100&page=${PAGE}")
            COUNT=$(echo "$VERSIONS" | jq 'length')
            [ "$COUNT" -eq 0 ] && break

            while IFS= read -r digest; do
              MANIFEST=$(curl -sf \
                -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
                -H "Authorization: Bearer ${REGISTRY_TOKEN}" \
                "https://ghcr.io/v2/${ORG}/${PACKAGE}/manifests/${digest}" || true)
              while IFS= read -r ref; do
                REFERENCED["$ref"]=1
                echo "  Keeping referenced sub-manifest: $ref"
              done < <(echo "$MANIFEST" | jq -r '.manifests[]?.digest // empty')
            done < <(echo "$VERSIONS" | jq -r '.[] | select(.metadata.container.tags | length > 0) | .name')

            PAGE=$((PAGE + 1))
          done

          echo "Total referenced sub-manifests: ${#REFERENCED[@]}"

          # Delete untagged versions that are not referenced by any tagged manifest
          PAGE=1
          DELETED=0
          KEPT_RECENT=0
          while true; do
            VERSIONS=$(curl -sf -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/${ORG}/packages/container/${PACKAGE}/versions?per_page=100&page=${PAGE}")
            COUNT=$(echo "$VERSIONS" | jq 'length')
            [ "$COUNT" -eq 0 ] && break

            while IFS= read -r item; do
              VERSION_ID=$(echo "$item" | jq -r '.id')
              DIGEST=$(echo "$item" | jq -r '.name')
              CREATED=$(echo "$item" | jq -r '.created_at')
              if [[ -n "${REFERENCED[$DIGEST]+_}" ]]; then
                echo "Keeping referenced: $VERSION_ID ($DIGEST)"
                continue
              fi
              # Untagged is not the same as unused. A campaign's results pin the image it ran
              # by DIGEST, so once that tag moves on the digest it recorded is untagged --
              # while still being the only thing a re-run of that campaign can start from.
              # Deleting it immediately is what made "re-run last month's campaign"
              # unanswerable, and nothing in the campaign said why.
              #
              # The grace window does not make images permanent -- that would not scale to
              # the number of images this produces. It buys the interval in which a recent
              # campaign is most likely to be re-run, and past it the honest answer is a
              # rebuild: since each image records its own apt/pip lock
              # (/etc/robovast/build-manifest) and its source refs are pinned, that is now a
              # real path rather than archaeology.
              AGE_DAYS=$(( ( $(date -u +%s) - $(date -u -d "$CREATED" +%s) ) / 86400 ))
              if [[ "$AGE_DAYS" -lt "$GRACE_DAYS" ]]; then
                echo "Keeping untagged but recent (${AGE_DAYS}d < ${GRACE_DAYS}d): $VERSION_ID ($DIGEST)"
                KEPT_RECENT=$((KEPT_RECENT + 1))
                continue
              fi
              echo "Deleting untagged+unreferenced, ${AGE_DAYS}d old: $VERSION_ID ($DIGEST)"
              curl -sf -L -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/orgs/${ORG}/packages/container/${PACKAGE}/versions/${VERSION_ID}"
              DELETED=$((DELETED + 1))
            done < <(echo "$VERSIONS" | jq -c '.[] | select(.metadata.container.tags | length == 0)')

            PAGE=$((PAGE + 1))
          done
          echo "Done. Deleted $DELETED untagged unreferenced versions, kept $KEPT_RECENT within the ${GRACE_DAYS}-day grace window."
