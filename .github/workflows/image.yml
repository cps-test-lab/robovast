name: Build and Push Container Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Validate compat version consistency
        run: |
          PYTHON_VER=$(grep -oP 'COMPAT_VERSION\s*=\s*\K\d+' src/robovast/common/execution.py)
          DOCKER_FILE=$(grep -oP 'echo "\K\d+(?=" > /etc/robovast_compat_version)' container/robovast/Dockerfile)
          echo "Python COMPAT_VERSION: $PYTHON_VER"
          echo "Dockerfile /etc file: $DOCKER_FILE"
          if [ "$PYTHON_VER" != "$DOCKER_FILE" ]; then
            echo "::error::Compat version mismatch! Python=$PYTHON_VER, File=$DOCKER_FILE"
            exit 1
          fi
          echo "Compat version check passed: $PYTHON_VER"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read the architecture policy
        id: plat
        # container/platforms.env is the single source of truth, shared with
        # container/release_images.sh, so a CI build and a local build cannot disagree
        # about what an image is built for.
        run: . container/platforms.env && echo "platforms=$PLATFORMS_ROBOVAST" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ steps.plat.outputs.platforms }}
          context: .
          file: ./container/robovast/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ROS_DISTRO=jazzy

  # The stepped-simulator image: the base plus roqsim. Depends on the base build so it
  # can be built FROM the tag that job just pushed -- built against a floating :latest the
  # two could describe different framework code while looking like a matched pair.
  #
  # No compat-version check of its own: it inherits /etc/robovast_compat_version from the
  # base, so a second check could only ever disagree with the first. The integration test
  # asserts the inheritance instead.
  build-and-push-roqsim:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-roqsim
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Read the architecture policy
        id: plat
        # container/platforms.env is the single source of truth, shared with
        # container/release_images.sh, so a CI build and a local build cannot disagree
        # about what an image is built for.
        run: . container/platforms.env && echo "platforms=$PLATFORMS_ROQSIM" >> "$GITHUB_OUTPUT"

      - name: Build and push roqsim image
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ steps.plat.outputs.platforms }}
          context: .
          file: ./container/robovast/Dockerfile.roqsim
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name == github.event.repository.default_branch && 'latest' || github.ref_name }}
            ROQSIM_REF=${{ vars.ROQSIM_REF || 'main' }}

  integration-test:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -

      - name: Add Poetry to PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies with Poetry
        run: |
          poetry install --no-root
          poetry install

      - name: Compute image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "tag=ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=ghcr.io/${{ github.repository }}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Example tests
        run: |
          rm -rf /tmp/vast_test_output
          mkdir /tmp/vast_test_output
          poetry run .github/test_vast.py configs/examples/growth_sim/growth_sim.vast \
            -c test-1-1 -d /tmp/vast_test_output -r 1 \
            --image "${{ steps.image.outputs.tag }}"

  build-and-push-sidecar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for sidecar image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-sidecar
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read the architecture policy
        id: plat
        # container/platforms.env is the single source of truth, shared with
        # container/release_images.sh, so a CI build and a local build cannot disagree
        # about what an image is built for.
        run: . container/platforms.env && echo "platforms=$PLATFORMS_SIDECAR" >> "$GITHUB_OUTPUT"

      - name: Build and push sidecar image
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ steps.plat.outputs.platforms }}
          context: ./container/sidecar
          file: ./container/sidecar/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-controller:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for controller image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-controller
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read the architecture policy
        id: plat
        # container/platforms.env is the single source of truth, shared with
        # container/release_images.sh, so a CI build and a local build cannot disagree
        # about what an image is built for.
        run: . container/platforms.env && echo "platforms=$PLATFORMS_CONTROLLER" >> "$GITHUB_OUTPUT"

      - name: Build and push controller image
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ steps.plat.outputs.platforms }}
          # Repo root context so pyproject + src are available for `pip install .`.
          context: .
          file: ./container/controller/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
