name: Build and Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: read-all
jobs:
  build-and-test:
    name: 'Build with Poetry and test commands'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # `make venv`, not `poetry install`: this repo ships five distributions that all
      # populate the `robovast` namespace, and only three of them are path dependencies of
      # the root. `poetry install` therefore produced an environment with no execution lane
      # but `local` -- `vast exec cluster setup` did not exist and the CLI test failed on it
      # -- and installed robovast-client as a *copy*, which tests/test_editable_installs.py
      # exists to catch. The Makefile target is the single supported dev install and is what
      # doc.yml already builds against; installing the same way here keeps CI testing the
      # thing developers run.
      - name: Install RoboVAST
        run: make venv

      - name: Run CLI tests
        run: |
          bash .github/test_commands.sh

      - name: Run unit tests
        run: |
          . venv/bin/activate && pytest tests/ -q
