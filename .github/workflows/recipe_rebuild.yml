# Does the recipe an image records actually rebuild it?
#
# `make check-recipe` asks the cheap questions on every pull request: are the pins all present,
# do the dated archives still answer. Neither can tell whether those pins are the COMPLETE set
# of inputs -- something reaching the network unpinned passes both and fails only in a rebuild.
#
# So this rebuilds. Weekly rather than per-PR because it costs a full image build, and weekly is
# often enough for what it finds: an archive pruned of the versions the lock names, a git ref
# that moved, an input nobody thought to pin. Each of those is discovered here instead of by
# somebody trying to reproduce a year-old campaign.
#
# It rebuilds an image from ITS OWN recorded recipe and compares the software with itself, so it
# needs no archived campaign as a fixture and tests exactly the property the recipe claims.
name: Recipe rebuild

on:
  schedule:
    # Monday morning: a failure here is somebody's week, not somebody's weekend.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      image:
        description: Image to rebuild from its own recipe
        default: ghcr.io/cps-test-lab/robovast:latest

permissions:
  contents: read
  packages: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Work out which image to check
        id: target
        run: |
          image='${{ inputs.image }}'
          echo "image=${image:-ghcr.io/cps-test-lab/robovast:latest}" >> "$GITHUB_OUTPUT"

      # The default branch first, only to get the tool. Which revision to actually build at is
      # the image's to say, and the next step asks it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile is an input too, and the recipe records the commit it came from rather
      # than the file. Building today's Dockerfile with an old image's pins would test a
      # combination that never existed, and any difference would be drift rather than a finding.
      - name: Check out the revision the image was built from
        run: |
          set -euo pipefail
          revision=$(python3 tools/rebuild_from_recipe.py \
            --image '${{ steps.target.outputs.image }}' --print-revision)
          echo "Rebuilding at $revision"
          # The DOCKERFILE has to be the one that produced the image. The TOOL does not, and
          # must not: taken from the same revision it could only ever be the version that
          # shipped with that image, so a fix to the checker would not reach the check until
          # a new image had been published by the fixed checker. Keep it from HEAD.
          cp tools/rebuild_from_recipe.py "$RUNNER_TEMP/rebuild_from_recipe.py"
          git checkout --detach "$revision"

      # The build lock can only be read by running the image, so it has to be here.
      - name: Pull the image being checked
        run: docker pull '${{ steps.target.outputs.image }}'

      - name: Rebuild from the recorded recipe and compare the software
        run: |
          python3 "$RUNNER_TEMP/rebuild_from_recipe.py" \
            --image '${{ steps.target.outputs.image }}'
